services:
  ssh-honeypot:
    build: .
    container_name: ssh-honeypot
    restart: unless-stopped
    ports:
      - "22:22"
    volumes:
      - ./data/log:/data/log
      - ./data/hostkey:/data/hostkey
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
